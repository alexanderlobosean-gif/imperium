# ============================================================
# NGINX CONFIGURAÇÃO COMPLETA - ImperiumClub
# Inclui: HTTPS, SSL, Proxy para Backend, Frontend
# ============================================================

# =============================
# API - api.imperiumclub.asia
# =============================
server {
    listen 80;
    server_name api.imperiumclub.asia;
    
    # Redirecionar HTTP para HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.imperiumclub.asia;
    
    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.imperiumclub.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.imperiumclub.asia/privkey.pem;
    
    # SSL Otimização
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Proxy para Backend Node.js
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        proxy_buffering off;
        proxy_cache off;
    }
    
    # WebSocket support (se necessário)
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# =============================
# FRONTEND - imperiumclub.asia
# =============================
server {
    listen 80;
    server_name imperiumclub.asia www.imperiumclub.asia;
    
    # Redirecionar HTTP para HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imperiumclub.asia www.imperiumclub.asia;
    
    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/imperiumclub.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imperiumclub.asia/privkey.pem;
    
    # SSL Otimização
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Proxy API requests
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_cache off;
    }
    
    # Frontend Static Files
    location / {
        root /var/www/imperium/dist;
        try_files $uri $uri/ /index.html;
        
        # Cache assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# =============================
# DEFAULT - Catch all
# =============================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
